<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>daily horoscope generator widget</title>
<meta name="description" content="A widget that generates a daily horoscope based on the user's zodiac sign, providing a fun and insightful daily reading." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>daily horoscope generator widget</h1>
<p>A widget that generates a daily horoscope based on the user's zodiac sign, providing a fun and insightful daily reading.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
