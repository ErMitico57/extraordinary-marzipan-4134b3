<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planetary Alignment Finder</title>
<meta name="description" content="A tool that helps users find upcoming planetary alignments, displaying a visual solar system map with planet positions and constellations, allowing users to select dates and view celestial events in a starry night interface." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>Planetary Alignment Finder</h1>
<p>A tool that helps users find upcoming planetary alignments, displaying a visual solar system map with planet positions and constellations, allowing users to select dates and view celestial events in a starry night interface.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
