<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMI calculator simple</title>
<meta name="description" content="A simple Body Mass Index (BMI) calculator with a celestial twist, where users input height and weight to see their BMI and health category, presented on a starry background with planets representing different BMI ranges." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>BMI calculator simple</h1>
<p>A simple Body Mass Index (BMI) calculator with a celestial twist, where users input height and weight to see their BMI and health category, presented on a starry background with planets representing different BMI ranges.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
