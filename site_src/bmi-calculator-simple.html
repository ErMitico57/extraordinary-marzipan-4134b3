<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMI calculator simple</title>
<meta name="description" content="A celestial-themed BMI calculator that presents your body mass index as a planetary health score, comparing your results to planetary gravities and offering wellness tips under a starry sky." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>BMI calculator simple</h1>
<p>A celestial-themed BMI calculator that presents your body mass index as a planetary health score, comparing your results to planetary gravities and offering wellness tips under a starry sky.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
