<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>random name generator for babies</title>
<meta name="description" content="A baby name generator that suggests random names based on celestial themes (stars, constellations, mythological figures) and allows filtering by gender, origin, and meaning, with each name accompanied by a brief description." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>random name generator for babies</h1>
<p>A baby name generator that suggests random names based on celestial themes (stars, constellations, mythological figures) and allows filtering by gender, origin, and meaning, with each name accompanied by a brief description.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
