<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>random name generator for babies</title>
<meta name="description" content="A celestial‑themed name generator that suggests baby names derived from stars, planets, and constellations, complete with meanings and optional filters for gender or initial letter." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>random name generator for babies</h1>
<p>A celestial‑themed name generator that suggests baby names derived from stars, planets, and constellations, complete with meanings and optional filters for gender or initial letter.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; })
</script>
</body>
</html>
