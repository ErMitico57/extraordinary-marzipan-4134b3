<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>

<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
