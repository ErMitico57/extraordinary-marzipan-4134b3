<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>moon phase calculator</title>
<meta name="description" content="A tool that calculates the moon phase for a given date (e.g., birthdate) and displays the phase name and an illustration of the moon." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>moon phase calculator</h1>
<p>A tool that calculates the moon phase for a given date (e.g., birthdate) and displays the phase name and an illustration of the moon.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
