<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life path number calculator</title>
<meta name="description" content="A tool that calculates your life path number from your birthdate, revealing insights about your life purpose and challenges." />
<link rel="stylesheet" href="style.css" />
<style>
  .calculator-box {
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 24px 24px;
    margin: 30px auto;
    max-width: 560px;
    box-shadow: 0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(6px);
  }
  .form-row {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }
  .form-group {
    flex: 1;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 7px;
    text-transform: uppercase;
  }
  input[type="date"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 11px;
    background: rgba(5,8,26,.6);
    border: 1px solid var(--line-soft);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 15px;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="date"]::placeholder {
    color: var(--muted-2);
  }
  input[type="date"]:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(232,180,104,.16);
  }
  .calculate-btn {
    width: 100%;
    margin-top: 8px;
    padding: 15px 18px;
    border: none;
    cursor: pointer;
    border-radius: 12px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15.5px;
    color: #241803;
    letter-spacing: .01em;
    background: linear-gradient(180deg, var(--gold-2), var(--gold-deep));
    box-shadow: 0 14px 30px -12px rgba(232,180,104,.6), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .calculate-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
  }
  .calculate-btn:active {
    transform: translateY(0);
  }
  .result {
    display: none;
    padding: 20px 0 0;
    text-align: center;
  }
  .result.show {
    display: block;
  }
  .result-number {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(30px, 6vw, 48px);
    letter-spacing: .5px;
    color: var(--cream);
    margin: 12px 0 8px;
  }
  .meaning {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--muted);
    line-height: 1.6;
    max-height: 120px;
    overflow: auto;
    text-align: left;
    padding: 0 15px;
    margin-top: 10px;
  }
  .meaning::-webkit-scrollbar {
    width: 6px;
  }
  .meaning::-webkit-scrollbar-track {
    background: rgba(255,255,255,.02);
  }
  .meaning::-webkit-scrollbar-thumb {
    background: rgba(232,180,104,.3);
    border-radius: 3px;
  }
  .note {
    font-size: 13px;
    color: var(--muted-2);
    margin-top: 16px;
    text-align: center;
    font-style: italic;
  }
</style>
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
  <h1>Life path number calculator</h1>
  <p>A tool that calculates your life path number from your birthdate, revealing insights about your life purpose and challenges.</p>
  
  <div class="calculator-box">
    <form id="lpcForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="birthdate">Your birthdate</label>
        <input type="date" id="birthdate" name="birthdate" max="today">
      </div>
      <button type="submit" class="calculate-btn">Calculate my life path number &nbsp;→</button>
      <div class="error" id="error" style="color:#ff9b8a; font-size:13px; margin-top:10px; text-align:center; min-height:1px;"></div>
    </form>
    
    <div class="result" id="result">
      <div class="result-number" id="lpNumber">—</div>
      <div class="meaning" id="lpMeaning">Your life path number reveals your core purpose and the challenges you may face.</div>
      <div class="note">Note: Master numbers (11, 22, 33) are not reduced further.</div>
    </div>
  </div>
</div>

<script>
  (function(){
    "use strict";
    
    const form = document.getElementById('lpcForm');
    const birthdateInput = document.getElementById('birthdate');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');
    const lpNumberDiv = document.getElementById('lpNumber');
    const lpMeaningDiv = document.getElementById('lpMeaning');
    
    // Meaning descriptions for life path numbers
    const meanings = {
      1: "Leadership, independence, and individuality. You are a pioneer with strong drive and determination.",
      2: "Cooperation, balance, and harmony. You are a diplomat who thrives in partnerships and seeks peace.",
      3: "Creativity, self-expression, and joy. You are expressive, optimistic, and inspire others with your charm.",
      4: "Stability, practicality, and hard work. You are a builder who values security and lays solid foundations.",
      5: "Freedom, adventure, and change. You are versatile, curious, and seek variety and new experiences.",
      6: "Love, nurturing, and responsibility. You are a caregiver who creates harmony and supports others.",
      7: "Analysis, introspection, and wisdom. You are a seeker of truth, drawn to spirituality and inner knowledge.",
      8: "Authority, success, and material abundance. You are a leader who excels in business and achieves goals.",
      9: "Compassion, humanitarianism, and completion. You are a healer who serves others and seeks universal love.",
      11: "Intuition, inspiration, and spiritual illumination. You are a visionary with heightened sensitivity and insight.",
      22: "Master builder, large-scale endeavors, and practical idealism. You can turn dreams into reality on a grand scale.",
      33: "Master teacher, compassionate guidance, and spiritual upliftment. You embody love and wisdom to uplift humanity."
    };
    
    function calculateLifePath(dateStr) {
      if (!dateStr) return null;
      
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return null;
      
      const month = date.getMonth() + 1; // 1-12
      const day = date.getDate(); // 1-31
      const year = date.getFullYear(); // e.g., 1990
      
      // Function to reduce a number to a single digit or master number
      function reduceNumber(num) {
        // Master numbers 11, 22, 33 are not reduced
        if (num === 11 || num === 22 || num === 33) return num;
        
        let sum = 0;
        while (num > 0) {
          sum += num % 10;
          num = Math.floor(num / 10);
          if (num === 0 && sum >= 10) {
            num = sum;
            sum = 0;
          }
        }
        return sum;
      }
      
      const reducedMonth = reduceNumber(month);
      const reducedDay = reduceNumber(day);
      const reducedYear = reduceNumber(year);
      
      let total = reducedMonth + reducedDay + reducedYear;
      return reduceNumber(total);
    }
    
    function showError(msg) {
      errorDiv.textContent = msg;
      resultDiv.classList.remove('show');
    }
    
    function hideError() {
      errorDiv.textContent = '';
    }
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      hideError();
      
      const dateStr = birthdateInput.value;
      if (!dateStr) {
        showError('Please enter your birthdate.');
        return;
      }
      
      const lp = calculateLifePath(dateStr);
      if (lp === null) {
        showError('Invalid date. Please select a valid date.');
        return;
      }
      
      lpNumberDiv.textContent = lp;
      lpMeaningDiv.textContent = meanings[lp] || 'Meaning not available.';
      resultDiv.classList.add('show');
      
      // Scroll to result
      setTimeout(() => {
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    });
    
    // Set max date to today to prevent future dates
    const today = new Date().toISOString().split('T')[0];
    birthdateInput.setAttribute('max', today);
  })();
</script>
</body>
</html>
