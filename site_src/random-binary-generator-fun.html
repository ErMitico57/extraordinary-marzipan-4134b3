<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>random binary generator fun</title>
<meta name="description" content="A celestial-themed binary toy where users generate random streams of 1s and 0s that twinkle like stars, with options to decode them into ASCII messages or star patterns." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="ads-container"></div>
<div class="content" style="max-width:800px;margin:2rem auto;padding:1rem;">
<h1>random binary generator fun</h1>
<p>A celestial-themed binary toy where users generate random streams of 1s and 0s that twinkle like stars, with options to decode them into ASCII messages or star patterns.</p>
</div>
<script>
  fetch('/_ads.html')
    .then(r => r.text())
    .then(html => { document.getElementById('ads-container').innerHTML = html; });
</script>
</body>
</html>
